function stopStream(){if(st.hls){try{st.hls.destroy()}catch(e){}st.hls=null}audio.pause();audio.removeAttribute('src');audio.load()}function hls(u){return/\.m3u8(?:\?|$)/i.test(u)}function graph(){if(st.ctx||!st.eq.on)return;try{const A=AudioContext||webkitAudioContext;st.ctx=new A();st.fs=st.ctx.createMediaElementSource(audio);const lo=st.ctx.createBiquadFilter(),mi=st.ctx.createBiquadFilter(),hi=st.ctx.createBiquadFilter(),an=st.ctx.createAnalyser();lo.type='lowshelf';lo.frequency.value=100;mi.type='peaking';mi.frequency.value=1000;mi.Q.value=.9;hi.type='highshelf';hi.frequency.value=6500;an.fftSize=128;st.an=an;st.fs.connect(lo).connect(mi).connect(hi).connect(an).connect(st.ctx.destination);st.filters={lo,mi,hi};applyEq()}catch(e){toast('DSP desteklenmiyor; düz ses devam ediyor')}}function applyEq(){if(!st.filters)return;st.filters.lo.gain.value=st.eq.on?st.eq.b:0;st.filters.mi.gain.value=st.eq.on?st.eq.m:0;st.filters.hi.gain.value=st.eq.on?st.eq.t:0;if(st.ctx?.state==='suspended')st.ctx.resume()}function go(){graph();const p=audio.play();if(p)p.catch(()=>{st.play=false;render();toast('Oynatmak için tekrar dokunun')})}function fail(){const x=cur();if(x&&st.src+1<x.src.length){st.src++;toast('Yedek adres deneniyor');load(st.i,st.src)}else{st.play=false;render();toast('Yayın adresleri cevap vermiyor')}}function load(i,src=0){const x=STATIONS[i];if(!x)return;st.i=i;st.src=src;stopStream();st.play=true;render();$('#stat').textContent='Bağlanıyor…';const u=x.src[src];audio.onerror=fail;if(hls(u)&&window.Hls&&Hls.isSupported()){st.hls=new Hls({enableWorker:true,maxBufferLength:30});st.hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fail()});st.hls.on(Hls.Events.MANIFEST_PARSED,go);st.hls.loadSource(u);st.hls.attachMedia(audio)}else{audio.src=u;audio.load();go()}localStorage.setItem('last',x.id)}function select(id){const i=STATIONS.findIndex(x=>x.id===id);if(i>=0)load(i)}function step(n){const a=list();if(!a.length)return;let i=a.findIndex(x=>x.id===cur()?.id);i=(i<0?0:(i+n
